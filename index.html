<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นางมณโฑขึ้นพ้อ - A STUDY OF THE KHON PERFORMANCE</title>
    <style>
        /* รีเซ็ตค่าเริ่มต้น */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000; /* พื้นหลังสีดำ */
        }

        /* คอนเทนเนอร์หลักสำหรับแบบเลื่อนต่อกัน */
        .scroll-container {
            width: 100%;
            max-width: 1280px; /* ไม่ให้กว้างเกินไปบนจอคอมพิวเตอร์ */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* ตั้งค่าแต่ละหน้าสไลด์ให้ขยายเต็ม 100% */
        .slide {
            width: 100%;
            position: relative;
        }

        /* รูปภาพขยายเต็มความกว้างเสมอและปรับความสูงอัตโนมัติ */
        .slide img {
            width: 100%;
            height: auto;
            display: block; /* ลบช่องว่างด้านล่างของรูป */
        }

        /* ----- ส่วนเฉพาะสำหรับรูปที่ 7 (จุดกดคลิก) ----- */
        .interactive-wrapper {
            position: relative;
            width: 100%;
        }

        /* ปุ่มล่องหนสำหรับกดไปลิงก์ */
        .click-area {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            border-radius: 5px; /* ลดความโค้งลงเพื่อให้คลุมขอบจอได้ดีขึ้น */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* เอฟเฟกต์เวลานำเมาส์ไปชี้ (ในคอมพิวเตอร์) */
        .click-area:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            background: rgba(255, 255, 255, 0.05);
        }

        /* พิกัดจอ Facebook (ซ้าย) */
        .link-fb {
            left: 22%;
            top: 38%;
            width: 18%;
            height: 54%;
        }

        /* พิกัดจอ Instagram (ขวา) */
        .link-ig {
            left: 60%;
            top: 38%;
            width: 18%;
            height: 54%;
        }
        /* ---------------------------------------------------- */

        /* เครดิตผู้สร้าง */
        .credit {
            text-align: right;
            padding: 20px 30px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            background-color: #000;
        }
    </style>
</head>
<body>

<div class="scroll-container">
    <!-- รูปที่ 1: หน้าปก -->
    <div class="slide">
        <img src="1.png" alt="หน้าปก">
    </div>

    <!-- รูปที่ 2: ความเป็นมา -->
    <div class="slide">
        <img src="4.png" alt="ความเป็นมา">
    </div>

    <!-- รูปที่ 3: วัตถุประสงค์ -->
    <div class="slide">
        <img src="3.png" alt="วัตถุประสงค์">
    </div>

    <!-- รูปที่ 4: กรอบแนวคิด -->
    <div class="slide">
        <img src="5.png" alt="กรอบแนวคิด">
    </div>

    <!-- รูปที่ 5: สรุปผลการวิจัย -->
    <div class="slide">
        <img src="6.png" alt="สรุปผลการวิจัย">
    </div>

    <!-- รูปที่ 6: คณะผู้วิจัย -->
    <div class="slide">
        <img src="2.png" alt="คณะผู้วิจัย">
    </div>

    <!-- รูปที่ 7: ช่องทางการติดตาม -->
    <div class="slide">
        <div class="interactive-wrapper">
            <img src="7.png" alt="ช่องทางการติดตามนางมณโฑขึ้นพ้อ">

            <!-- จุดกดเฟสบุ๊ค -->
            <a href="https://www.facebook.com/share/1CdH22MfT1/?mibextid=wwXIfr" target="_blank" class="click-area link-fb" title="ไปยังเพจ Facebook"></a>

            <!-- จุดกดไอจี -->
            <a href="https://www.instagram.com/nangmontho_khenpor?stkn=djhlbnR3cHY1eHhz" target="_blank" class="click-area link-ig" title="ไปยัง Instagram"></a>
        </div>
    </div>

    <!-- เครดิต -->
    <div class="credit">BY VENUS</div>
</div>

</body>
</html>
